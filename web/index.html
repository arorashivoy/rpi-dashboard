<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f2eb">
    <title>Pi Control Room</title>
    <link rel="stylesheet" href="/style.css?v=2">
    <script src="/app.js?v=nerd-stats-2" defer></script>
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Pi Control Room home">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span>PI / CONTROL ROOM</span>
            </a>
            <div class="topbar-right">
                <span class="host-label"><span class="live-dot"></span> LOCAL NODE</span>
                <button class="icon-button" id="refresh" type="button" aria-label="Reload apps.json and refresh status"
                    title="Reload apps.json and refresh status">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" />
                    </svg>
                </button>
            </div>
        </header>

        <section class="overview" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">RASPBERRY PI 4 <span>·</span> 4 GB</p>
                <h1 id="page-title">Your services,<br><em>at a glance.</em></h1>
            </div>
            <div class="summary" aria-live="polite">
                <div class="summary-count"><strong id="running-count">–</strong><span>RUNNING</span></div>
                <div class="summary-divider"></div>
                <div class="summary-count"><strong id="published-count">–</strong><span>HOSTNAMES</span></div>
            </div>
        </section>

        <section class="service-section" aria-labelledby="services-title">
            <div class="section-heading">
                <h2 id="services-title">SERVICE REGISTER</h2>
                <span id="updated-at">Connecting…</span>
            </div>
            <div id="service-list" class="service-list" aria-live="polite"></div>
        </section>

        <footer class="footnote">
            <span>PI 4 / ARM64</span>
            <span class="nerd-stats" id="nerd-stats" aria-label="System statistics"></span>
            <span id="config-note">Configuration: apps.json</span>
        </footer>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
</body>

</html>
